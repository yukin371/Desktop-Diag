name: Windows quality gates

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go 1.26.0
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
          check-latest: true

      - name: Verify toolchain
        shell: powershell
        run: |
          $env:GOTOOLCHAIN = 'local'
          $version = (& go env GOVERSION).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -ne 'go1.26.0') { throw "Expected go1.26.0, got $version" }

      - name: Run unified quality gate
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/quality-gate.ps1 -CoverageFile dist/coverage.out -OutputDir dist/ci

      - name: Build and validate release package
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/release.ps1 -Version ci-${{ github.sha }} -OutputDir dist/ci-release

      - name: Upload verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-diag-ci-${{ github.sha }}
          path: |
            dist/coverage.out
            dist/ci/
            dist/ci-release/
          if-no-files-found: error
          retention-days: 14
